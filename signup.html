<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creat an account to explor and borrow books from our online library">
    <title>Sign Up | Online Library</title>
</head>
<body>

    <main>
        <section>
            <h1 id="signup-heading">Creat Your Account</h1>
            <p>Join our online library</p>

            <form action="#" method="post">
                <div>
                    <label for ="full name"></label>
                    <input 
                        type = "text"
                        id = "full name"
                        name = "fullName"
                        placeholder="Enter your full name"
                        required >
                </div>
                <div>
                    <label for ="email"></label>
                    <input 
                        type = "email"
                        id = "email"
                        name = "email"
                        placeholder="Enter your email"
                        required > 
                </div>
                <div>
                    <label for ="password"></label>
                    <input 
                        type = "password"
                        id = "password"
                        name = "password"
                        placeholder="Enter a password"
                        required >  
                </div>
                <div>
                    <label for ="confirm-password"></label>
                    <input 
                        type = "password"
                        id = "confirm-password"
                        name = "ConfirmPassword"
                        placeholder="confirm your password"
                        required >
                </div>
                <div>
                    <input 
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>
                    <label for ="terms">I agree to the terms and conditions</label>
                </div>

                <button type="submit">Creat Account</button>
            </form>

        </section>
        <p>
        Already have an account ?! 
        <a href ="login.html">Login</a>
    </p>
    </main>

    <footer>
        <p> &copy; 2026 Online Library. All rights reserved.</p>
    </footer>
</body>
</html>
