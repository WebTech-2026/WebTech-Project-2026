    <meta charset="UTF-8">

    <title>Sign Up | Online Library</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/2-Authentication.css">

    <script src="assets/js/validation.js" defer></script>
    <script src="assets/js/nav.js" defer></script>
    <script src="assets/js/signup.js" defer></script>
</head>
<body>

    <main data-redirect-if-logged-in>
        <section>
            <h1 id="signup-heading">Creat Your Account</h1>
            <p>Join our online library</p>

            <form action="#" method="post">
                <div>
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        minlength="3"
                        maxlength="20"
                        pattern="[A-Za-z0-9_]+"
                        title="Use 3–20 letters, digits, or underscores."
                        autocomplete="username"
                        required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="email"
                        required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        title="Use at least 8 characters, including an uppercase letter, a lowercase letter, and a digit."
                        autocomplete="new-password"
                        required>
                </div>
                <div>
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required>
                </div>
                <div>
                    <label for="role">Account type</label>
                    <select id="role" name="role" required>
                        <option value="">Select an account type</option>
                        <option value="user">User</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <button type="submit">Creat Account</button>
            </form>

        </section>
        <p>
        Already have an account ?! 
        <a href ="3-login.html">Login</a>
    </p>
    </main>

    <footer>
        <p> &copy; 2026 Online Library. All rights reserved.</p>
    </footer>
</body>
</html>
