<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your online Library">
    <title> Login | Online Library</title>
</head>
<body>

    <main>
        <section>
            <h1 id="Login-heading">Welcome Back</h1>
            <p>Log in to your account </p>
            <form action="#" method="post">
                <div>
                    <label for ="email"></label>
                    <input 
                        type = "email"
                        id = "email"
                        name = "email"
                        placeholder="Enter your email Address"
                        autocomplete="email"
                        required > 
                </div>
                <div>
                    <label for ="password"></label>
                    <input 
                        type = "password"
                        id = "password"
                        name = "password"
                        placeholder="Enter a password"
                        autocomplete="current-password"
                        required >
                </div>
                <div>
                    <input 
                        type="checkbox"
                        id="remember-me"
                        name="rememberme">
                    <label for ="remember-me">Remember Me</label>
                </div>
                <button type="submit">Creat Account</button>
            </form>
            <p>
                Do not have an account ?!  
                <a href ="signup.html">Sign-up</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Online Library. All rights reserved.</p>
    </footer>
</body>
</html>
